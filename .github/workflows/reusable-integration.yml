name: Reusable LocalStack Integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: LocalStack Terraform and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-release-assets
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
      - run: python -m pip install --disable-pip-version-check -r dev-requirements.txt
      - uses: ./.github/actions/setup-localstack
      - name: Run asynchronous event-mesh tests
        run: python -m pytest tests/integration -v --tb=short --junitxml=integration-results.xml
      - name: Publish truthful integration summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          status="$JOB_STATUS"
          icon="❌"
          [[ "$status" == "success" ]] && icon="✅"
          {
            echo "# ${icon} LocalStack Integration Evidence"
            echo
            echo "| Evidence | Result |"
            echo "| --- | --- |"
            echo "| Workflow conclusion | **${status^^}** |"
            echo "| Terraform | Immutable Lambda ZIP applied to LocalStack |"
            echo "| Event paths | SNS→SQS→Lambda→DynamoDB, DLQ, and S3 ingestion |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capture failure diagnostics
        if: failure()
        run: docker compose logs --no-color > localstack.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localstack-integration-evidence
          path: |
            integration-results.xml
            localstack.log
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown LocalStack
        if: always()
        run: docker compose down -v
