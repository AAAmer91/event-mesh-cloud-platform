name: Reusable LocalStack Integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: LocalStack Terraform and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: lambda-release-assets
          path: dist
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
      - run: python -m pip install --disable-pip-version-check -r dev-requirements.txt
      - uses: ./.github/actions/setup-localstack
      - name: Run asynchronous event-mesh tests
        run: python -m pytest tests/integration -v --tb=short --junitxml=integration-results.xml
      - name: Publish truthful integration summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          status="$JOB_STATUS"
          icon="❌"
          [[ "$status" == "success" ]] && icon="✅"
          {
            echo "# ${icon} LocalStack Integration Evidence"
            echo
            echo "| Evidence | Result |"
            echo "| --- | --- |"
            echo "| Workflow conclusion | **${status^^}** |"
            echo "| Terraform | Immutable Lambda ZIP applied to LocalStack |"
            echo "| Event paths | SNS→SQS→Lambda→DynamoDB, DLQ, and S3 ingestion |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capture failure diagnostics
        if: failure()
        run: docker compose logs --no-color > localstack.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: localstack-integration-evidence
          path: |
            integration-results.xml
            localstack.log
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown LocalStack
        if: always()
        run: docker compose down -v
