name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Immutable Build
    uses: ./.github/workflows/reusable-quality.yml

  security:
    name: Security and Supply Chain
    uses: ./.github/workflows/lint-and-security.yml
    permissions:
      contents: read
      id-token: write
      security-events: write

  integration:
    name: Cloud Integration
    needs: quality
    uses: ./.github/workflows/reusable-integration.yml

  quality-gate:
    name: Required Quality Gate
    if: always()
    needs: [quality, security, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required evidence
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          {
            echo "# CI/CD Quality Gate"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Quality and artifact build | $QUALITY_RESULT |"
            echo "| Security and supply chain | $SECURITY_RESULT |"
            echo "| LocalStack integration | $INTEGRATION_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$QUALITY_RESULT" == "success" ]]
          [[ "$SECURITY_RESULT" == "success" ]]
          [[ "$INTEGRATION_RESULT" == "success" ]]

  pr-report:
    name: Publish Evidence-based PR Report
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              filter: 'latest',
            });
            const rows = jobs
              .filter(job => job.name !== 'Publish Evidence-based PR Report')
              .map(job => `| ${job.name} | ${job.conclusion === 'success' ? '✅' : job.conclusion === 'skipped' ? '⏭️' : '❌'} ${job.conclusion ?? 'unknown'} |`)
              .join('\n');
            const marker = '<!-- event-mesh-ci-evidence -->';
            const body = `${marker}
            ### CI/CD evidence for \`${context.sha.substring(0, 7)}\`

            | Executed gate | Actual conclusion |
            | --- | --- |
            ${rows}

            **Pipeline:** [run #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            _Generated from completed jobs; no predicted or hard-coded pass states._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  release:
    name: Release Tested Artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-gate
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write

  deploy-dev:
    name: Promote to Development
    if: needs.release.outputs.should_release == 'true' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      release_tag: ${{ needs.release.outputs.release_tag }}
    permissions:
      contents: read
      id-token: write

  deploy-production:
    name: Promote to Production
    if: needs.release.outputs.should_release == 'true' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    needs: [release, deploy-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      release_tag: ${{ needs.release.outputs.release_tag }}
    permissions:
      contents: read
      id-token: write
