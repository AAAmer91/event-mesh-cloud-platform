name: Performance Benchmark & Chaos Simulation

on:
  workflow_dispatch:
    inputs:
      event_count:
        description: "Number of events to benchmark"
        required: true
        default: "100"
        type: string
      batch_size:
        description: "Concurrent batch size"
        required: true
        default: "20"
        type: string
  schedule:
    # Run nightly at midnight UTC
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-and-chaos:
    name: Load & Chaos Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Start LocalStack via Docker Compose
        run: |
          docker compose up -d

      - name: Wait for LocalStack Readiness
        run: |
          echo "Waiting for LocalStack to be fully available..."
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep "\"s3\": \"running\""; then
              echo "LocalStack is ready!"
              break
            fi
            echo "Waiting for LocalStack ($i/30)..."
            sleep 2
          done

      - name: Initialize and Apply Terraform on LocalStack
        run: |
          cd infra/terraform/environments/local
          terraform init
          terraform apply -auto-approve

      - name: Run Load Benchmark Suite
        env:
          PYTHONPATH: .
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:event-mesh-local-order-events-topic
        run: |
          echo "Executing Event Mesh Load Benchmark..."
          python scripts/benchmark_events.py --total ${{ github.event.inputs.event_count || '100' }} --batch ${{ github.event.inputs.batch_size || '20' }} --direct --output benchmark_results.json

      - name: Run Chaos Engineering & Poison-Pill Simulation
        env:
          PYTHONPATH: .
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:event-mesh-local-order-events-topic
          DYNAMODB_TABLE_NAME: event-mesh-local-orders-table
        run: |
          echo "Executing Chaos & Fault Isolation Verification..."
          python scripts/chaos_test.py --count 50 --chaos-ratio 0.2 --output chaos_results.json

      - name: Generate & Publish Executive Platform Dashboard
        if: always()
        run: |
          python scripts/generate_summary.py benchmark_results.json chaos_results.json

      - name: Upload Benchmark & Chaos Telemetry Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-and-chaos-telemetry
          path: |
            benchmark_results.json
            chaos_results.json
          retention-days: 14

      - name: Teardown LocalStack
        if: always()
        run: |
          docker compose down -v

