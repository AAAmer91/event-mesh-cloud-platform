name: Performance Evidence and Chaos

on:
  workflow_dispatch:
    inputs:
      event_count:
        description: Events in the load benchmark
        required: true
        default: 100
        type: number
      batch_size:
        description: Concurrent benchmark workers
        required: true
        default: 20
        type: number
      chaos_count:
        description: Orders in the resilience simulation
        required: true
        default: 50
        type: number
      chaos_ratio:
        description: Poison-pill ratio
        required: true
        default: "0.2"
        type: string
  schedule:
    - cron: "0 0 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: performance-evidence
  cancel-in-progress: true

jobs:
  quality:
    name: Reuse Tested Build Pipeline
    uses: ./.github/workflows/reusable-quality.yml

  benchmark:
    name: Benchmark, Chaos, and Regression Analysis
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:event-mesh-local-order-events-topic
      DYNAMODB_TABLE_NAME: event-mesh-local-orders-table
      EVENT_COUNT: ${{ inputs.event_count || 100 }}
      BATCH_SIZE: ${{ inputs.batch_size || 20 }}
      CHAOS_COUNT: ${{ inputs.chaos_count || 50 }}
      CHAOS_RATIO: ${{ inputs.chaos_ratio || '0.2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-release-assets
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
      - run: python -m pip install --disable-pip-version-check -r dev-requirements.txt

      - name: Restore latest successful history and baseline
        run: |
          mkdir -p history previous
          previous_run="$(gh run list --workflow scheduled-benchmark.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$previous_run" ]]; then
            gh run download "$previous_run" --name performance-history --dir previous || true
          fi
          previous_history="$(find previous -name history.json -print -quit)"
          if [[ -n "$previous_history" ]]; then
            cp "$previous_history" history/history.json
            jq '.[-1].benchmark // empty' history/history.json > baseline.json
          else
            echo '[]' > history/history.json
          fi

      - uses: ./.github/actions/setup-localstack

      - name: Run load benchmark
        id: load
        continue-on-error: true
        run: >-
          python scripts/benchmark_events.py
          --total "$EVENT_COUNT"
          --batch "$BATCH_SIZE"
          --direct --output benchmark_results.json

      - name: Run poison-pill chaos simulation
        id: chaos
        continue-on-error: true
        run: >-
          python scripts/chaos_test.py
          --count "$CHAOS_COUNT"
          --chaos-ratio "$CHAOS_RATIO"
          --output chaos_results.json

      - name: Evaluate SLAs and historical regression
        id: validation
        if: always()
        continue-on-error: true
        run: |
          baseline_args=()
          [[ -s baseline.json ]] && baseline_args=(--baseline baseline.json)
          python scripts/validate_results.py \
            --benchmark benchmark_results.json \
            --chaos chaos_results.json \
            --output validation_results.json \
            "${baseline_args[@]}"

      - name: Publish dynamic run summary
        if: always()
        run: python scripts/generate_summary.py benchmark_results.json chaos_results.json

      - name: Render persistent GitHub Pages evidence
        if: always()
        run: >-
          python scripts/render_performance_site.py
          --history history/history.json
          --benchmark benchmark_results.json
          --chaos chaos_results.json
          --validation validation_results.json
          --output-dir site

      - name: Open, update, or resolve performance incident
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('validation_results.json', 'utf8'));
            const marker = '<!-- event-mesh-performance-incident -->';
            const title = 'Performance or resilience quality gate regression';
            for (const [name, color] of [['performance-regression', 'b60205'], ['automated', '1d76db']]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color });
              }
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'performance-regression'
            });
            const existing = issues.find(issue => issue.title === title);
            if (!report.passed) {
              const body = `${marker}\n## Automated regression evidence\n\n${report.failures.map(f => `- ❌ ${f}`).join('\n')}\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
              if (existing) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['performance-regression', 'automated'] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `✅ Regression recovered in [run ${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Export gate output
        id: result
        if: always()
        run: echo "passed=$(jq -r '.passed // false' validation_results.json)" >> "$GITHUB_OUTPUT"

      - name: Upload telemetry and persistent history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-history
          path: |
            benchmark_results.json
            chaos_results.json
            validation_results.json
            history/history.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Pages site
        if: always()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Teardown LocalStack
        if: always()
        run: docker compose down -v

  deploy-pages:
    name: Publish Performance Dashboard
    needs: benchmark
    if: always() && needs.benchmark.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  performance-gate:
    name: Enforce Performance Quality Gate
    if: always()
    needs: [benchmark, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - env:
          PASSED: ${{ needs.benchmark.outputs.passed }}
        run: test "$PASSED" = "true"
