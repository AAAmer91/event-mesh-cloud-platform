name: Reusable Release and Provenance

on:
  workflow_call:
    outputs:
      should_release:
        description: Whether conventional commits require a release
        value: ${{ jobs.release.outputs.should_release }}
      release_tag:
        description: Created semantic version tag
        value: ${{ jobs.release.outputs.release_tag }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Attest and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-release-assets
          path: dist
      - name: Calculate conventional semantic version
        id: version
        run: python scripts/release_version.py --github-output "$GITHUB_OUTPUT"
      - name: Generate release notes
        if: steps.version.outputs.should_release == 'true'
        run: |
          previous_tag="$(git describe --tags --abbrev=0)"
          {
            echo "## Changes"
            echo
            git log "${previous_tag}..HEAD" --pretty='format:- %s (%h)'
            echo
            echo "## Verification"
            echo
            echo "This exact Lambda ZIP passed unit, static-analysis, Terraform, LocalStack integration, and supply-chain gates before publication."
          } > dist/release-notes.md
      - name: Attest build provenance
        if: steps.version.outputs.should_release == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/lambda-package.zip
      - name: Attest SBOM
        if: steps.version.outputs.should_release == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/lambda-package.zip
          sbom-path: dist/sbom.cdx.json
      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/lambda-package.zip \
            dist/sbom.cdx.json \
            --target "$GITHUB_SHA" \
            --title "Event Mesh $RELEASE_TAG" \
            --notes-file dist/release-notes.md \
            --fail-on-no-commits
      - name: Explain skipped release
        if: steps.version.outputs.should_release != 'true'
        run: echo "No releasable conventional commits were found; artifact publication was intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
