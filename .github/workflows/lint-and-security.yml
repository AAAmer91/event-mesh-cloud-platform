name: Security and Supply Chain

on:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:python

  dependency-review:
    name: Dependency Vulnerability and License Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Dependency Graph availability
        id: dependency_graph
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          response_file="${RUNNER_TEMP}/dependency-review-preflight.json"
          status="$({
            curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}"
          })"

          case "${status}" in
            200)
              echo "available=true" >> "${GITHUB_OUTPUT}"
              ;;
            403|404)
              echo "available=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::Dependency Graph is disabled; enable it in Settings > Code security to activate the PR dependency-review gate."
              ;;
            *)
              cat "${response_file}"
              echo "Unexpected Dependency Graph API status: ${status}" >&2
              exit 1
              ;;
          esac
      - name: Enforce dependency and license policy
        if: steps.dependency_graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
      - name: Report unavailable dependency review
        if: steps.dependency_graph.outputs.available == 'false'
        run: |
          {
            echo "### Dependency Review"
            echo
            echo "> [!WARNING]"
            echo "> GitHub Dependency Graph is disabled, so PR dependency-diff review could not run."
            echo "> The blocking lockfile audit still ran; enable Dependency Graph to activate this additional gate."
          } >> "${GITHUB_STEP_SUMMARY}"

  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Block known runtime vulnerabilities
        run: python -m pip_audit --requirement requirements.lock --strict --desc --format json --output pip-audit.json
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-evidence
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 14

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: scorecard.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard-evidence
          path: scorecard.sarif
          if-no-files-found: error
          retention-days: 14
