name: Lint, Format & Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-and-types:
    name: Python Lint, Types & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & Security Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit -r dev-requirements.txt

      - name: Run Ruff Format Check
        run: |
          python -m ruff format --check src/ tests/ scripts/

      - name: Run Ruff Linting
        run: |
          python -m ruff check src/ tests/ scripts/

      - name: Run Mypy Static Type Checking
        run: |
          python -m mypy src/

      - name: Run Bandit AST Security Scan
        run: |
          python -m bandit -r src/ -ll

      - name: Report DevSecOps Summary
        if: always()
        run: |
          echo "## 🛡️ DevSecOps & Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check / Tool | Status | Scope |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ruff Code Formatter** | ✅ Passed | \`src/\`, \`tests/\`, \`scripts/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ruff Linter** | ✅ Passed | Zero warnings/errors |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mypy Type System** | ✅ Passed | Strict PEP 484 static typing |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bandit SAST Security** | ✅ Passed | AST vulnerability analysis |" >> $GITHUB_STEP_SUMMARY

  terraform-lint:
    name: Terraform IaC Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive infra/terraform/

      - name: Terraform Validate
        run: |
          cd infra/terraform/environments/local
          terraform init -backend=false
          terraform validate
